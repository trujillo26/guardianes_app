<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='formulario.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<header class="header">
    <span class="icon">&#9673;</span>
    <h1>FORMULARIO</h1>
    <div class="right">
        <a href="/dashboard" class="btn-regresar">REGRESAR</a>
        <div class="user">{{ user.nombre[0] | upper }}</div>
    </div>
</header>

<main>
    <form class="form-container" method="POST" action="/publicacion" enctype="multipart/form-data">

        {% if mensaje %}
        <p class="mensaje-ok">{{ mensaje }}</p>
        {% endif %}
        {% if error %}
        <p class="mensaje-error">{{ error }}</p>
        {% endif %}

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="cedula">Cédula</label>
        <input type="text" id="cedula" name="cedula" required>

        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" name="direccion" required>

        <label for="descripcion">Texto (Descripción)</label>
        <input type="text" id="descripcion" name="descripcion" required>

        <label for="imagen">Imagen</label>
        <div class="image-box">
            <input type="file" id="imagen" name="imagen" accept="image/*">
        </div>

        <label>Ubicación del incidente (toca el mapa para marcar)</label>
        <div id="mapa-formulario" class="mapa-form"></div>
        <p class="mapa-hint">Lat: <span id="lat-display">--</span> &nbsp; Lng: <span id="lng-display">--</span></p>

        <input type="hidden" id="latitud" name="latitud">
        <input type="hidden" id="longitud" name="longitud">

        <button type="submit" class="btn-enviar">ENVIAR</button>

    </form>
</main>

<script>
    // Centro por defecto: Bogotá
    const bogota = [4.7110, -74.0721];

    const mapa = L.map('mapa-formulario').setView(bogota, 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
    }).addTo(mapa);

    let marcador = null;

    mapa.on('click', function (e) {
        const { lat, lng } = e.latlng;

        if (marcador) {
            marcador.setLatLng(e.latlng);
        } else {
            marcador = L.marker(e.latlng).addTo(mapa);
        }

        document.getElementById('latitud').value = lat.toFixed(6);
        document.getElementById('longitud').value = lng.toFixed(6);
        document.getElementById('lat-display').innerText = lat.toFixed(6);
        document.getElementById('lng-display').innerText = lng.toFixed(6);
    });
</script>

</body>
</html>
