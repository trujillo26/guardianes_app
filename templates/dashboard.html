<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='principal.css') }}">
</head>
<body>

<header class="header">
    <h1>REPORTE</h1>
    <nav>
        <a href="#">Contacto</a>
        <a href="#">Policía</a>
        <div class="user">{{ session.nombre[0] | upper }}</div>
        <a href="/logout" class="btn-logout">Salir</a>
    </nav>
</header>

<main class="container">
    <div class="card">

        <div class="card-header">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Escudo_Polic%C3%ADa_Nacional_de_Colombia.svg/240px-Escudo_Polic%C3%ADa_Nacional_de_Colombia.svg.png" alt="logo">
            <span>Policía Nacional</span>
        </div>

        <form method="POST" action="/publicacion">
            <textarea name="descripcion" placeholder="Aquí Podrán Publicar Un Texto Sobre Su Publicación" required></textarea>

            <div class="photo-box"<span>FOTO</span></div>
            <a href="/formulario" class="btn-publicar">PUBLICAR</a>
                <span>FOTO</span>
            </div>
        </form>

    </div>
</main>

<!-- Reportes APROBADOS visibles para todos los usuarios -->
<section class="reportes-lista">
    <h2 class="section-title">Reportes aprobados</h2>
 
    {% for r in reportes_aprobados %}
    <div class="reporte-item aprobado">
        <div class="reporte-top">
            <strong>{{ r.nombre }}</strong>
            <span class="badge badge-aprobado">Aprobado</span>
        </div>
        <p class="reporte-desc">{{ r.descripcion }}</p>
        <div class="meta">
            📍 {{ r.direccion }} &nbsp;|&nbsp; 🗓 {{ r.fecha }}
        </div>
    </div>
    {% else %}
    <p class="empty-msg">No hay reportes aprobados aún.</p>
    {% endfor %}
</section>

</body>
</html>
